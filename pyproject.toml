[project]
name = "strategy-regime"
version = "0.1.0"
description = "Latent regime classification on market data, then conditional strategy selection per regime."
authors = [{ name = "Daniel Vieira Gatto" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "scikit-learn>=1.3",
  "hmmlearn>=0.3",
  "pyarrow>=14.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
